name: TMP Gen Golden Aulas

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  R_VERSION: '4.5.1'

jobs:
  gen:
    name: Generate golden-aulas RDS on ubuntu-latest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ env.R_VERSION }}
          use-public-rspm: true

      - name: Install R system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcurl4-openssl-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libfribidi-dev \
            libgdal-dev \
            libgeos-dev \
            libharfbuzz-dev \
            libjpeg-dev \
            libpng-dev \
            libproj-dev \
            libqpdf-dev \
            librsvg2-dev \
            libssl-dev \
            libtiff-dev \
            libudunits2-dev \
            libxml2-dev \
            libxt6 \
            qpdf

      - name: Install R package dependencies
        run: |
          Rscript -e "dir.create(Sys.getenv('R_LIBS_USER'), recursive = TRUE, showWarnings = FALSE); .libPaths(c(Sys.getenv('R_LIBS_USER'), .libPaths())); options(repos = c(CRAN = Sys.getenv('RSPM', 'https://packagemanager.posit.co/cran/__linux__/noble/latest'))); desc <- read.dcf('api/DESCRIPTION')[1, ]; fields <- intersect(c('Depends', 'Imports', 'Suggests'), names(desc)); pkgs <- trimws(unlist(strsplit(paste(stats::na.omit(desc[fields]), collapse = ','), ','), use.names = FALSE)); pkgs <- sub('[[:space:]]*[(].*$', '', pkgs); pkgs <- unique(setdiff(pkgs[nzchar(pkgs)], 'R')); installed <- rownames(installed.packages(lib.loc = .libPaths())); missing <- setdiff(pkgs, installed); if (length(missing)) install.packages(missing, lib = .libPaths()[1]); installed <- rownames(installed.packages(lib.loc = .libPaths())); missing_after <- setdiff(pkgs, installed); if (length(missing_after)) stop('Missing R packages after install: ', paste(missing_after, collapse = ', '))"

      - name: Generate golden-aulas RDS
        run: |
          Rscript -e "dir.create(Sys.getenv('R_LIBS_USER'), recursive = TRUE, showWarnings = FALSE); .libPaths(c(Sys.getenv('R_LIBS_USER'), .libPaths()))" \
            -e "source('api/tools/gen_golden_aulas.R')"

      - name: Upload golden-aulas RDS
        uses: actions/upload-artifact@v4
        with:
          name: golden-aulas-rds
          path: api/tests/testthat/_snaps/golden-aulas/*.rds
          retention-days: 3
