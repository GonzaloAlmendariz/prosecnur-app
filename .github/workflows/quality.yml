name: Quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:

permissions:
  contents: read

env:
  R_VERSION: '4.5.1'
  NODE_VERSION: '20'
  PNPM_VERSION: '10'

jobs:
  quality:
    name: Typecheck, tests, audits
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ env.R_VERSION }}
          use-public-rspm: true

      - name: Install R system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcurl4-openssl-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libfribidi-dev \
            libgdal-dev \
            libgeos-dev \
            libharfbuzz-dev \
            libjpeg-dev \
            libpng-dev \
            libproj-dev \
            libqpdf-dev \
            libssl-dev \
            libtiff-dev \
            libudunits2-dev \
            libxml2-dev \
            libxt6 \
            qpdf

      - name: Install frontend dependencies
        run: pnpm -C frontend install --frozen-lockfile

      - name: Install desktop dependencies
        run: pnpm -C desktop install --frozen-lockfile

      - name: Frontend typecheck
        run: pnpm -C frontend exec tsc --noEmit --pretty false

      - name: Frontend tests
        run: pnpm -C frontend test

      - name: Frontend production build
        run: pnpm -C frontend exec vite build --outDir /tmp/prosecnur-vite-build --emptyOutDir

      - name: Frontend audit
        run: pnpm -C frontend audit --audit-level=high

      - name: Desktop audit
        run: pnpm -C desktop audit --audit-level=high

      - name: Install R package dependencies
        run: |
          Rscript -e "dir.create(Sys.getenv('R_LIBS_USER'), recursive = TRUE, showWarnings = FALSE); .libPaths(c(Sys.getenv('R_LIBS_USER'), .libPaths())); options(repos = c(CRAN = 'https://packagemanager.posit.co/cran/__linux__/jammy/latest')); desc <- read.dcf('api/DESCRIPTION')[1, ]; fields <- intersect(c('Depends', 'Imports', 'Suggests'), names(desc)); pkgs <- trimws(unlist(strsplit(paste(stats::na.omit(desc[fields]), collapse = ','), ','), use.names = FALSE)); pkgs <- sub('[[:space:]]*[(].*$', '', pkgs); pkgs <- unique(setdiff(pkgs[nzchar(pkgs)], 'R')); installed <- rownames(installed.packages(lib.loc = .libPaths())); missing <- setdiff(pkgs, installed); if (length(missing)) install.packages(missing, lib = .libPaths()[1]); installed <- rownames(installed.packages(lib.loc = .libPaths())); missing_after <- setdiff(pkgs, installed); if (length(missing_after)) stop('Missing R packages after install: ', paste(missing_after, collapse = ', '))"

      - name: R load_all
        run: Rscript -e "dir.create(Sys.getenv('R_LIBS_USER'), recursive = TRUE, showWarnings = FALSE); .libPaths(c(Sys.getenv('R_LIBS_USER'), .libPaths())); pkgload::load_all('api', quiet = TRUE)"

      - name: R tests
        run: Rscript -e "dir.create(Sys.getenv('R_LIBS_USER'), recursive = TRUE, showWarnings = FALSE); .libPaths(c(Sys.getenv('R_LIBS_USER'), .libPaths())); pkgload::load_all('api', quiet = TRUE); testthat::test_dir('api/tests/testthat', reporter = 'summary')"
