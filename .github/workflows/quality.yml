name: Quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:
  # Corrida manual sobre cualquier branch (p. ej. validar goldens en ubuntu
  # antes de tocar main): gh workflow run quality.yml --ref <branch>
  workflow_dispatch:

permissions:
  contents: read

# Pushes en ráfaga a main cancelan el run anterior del mismo ref: solo importa
# el estado del último commit. Los tags (via workflow_call desde Release) usan
# un ref propio, así que nunca se cancelan entre sí ni cancelan a main.
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  R_VERSION: '4.5.1'
  NODE_VERSION: '20'
  PNPM_VERSION: '10'

jobs:
  agentic-os:
    name: Agentic OS (sync, contracts, smokes)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Test synchronizer and orchestration policy
        run: node --test agentic/tests/*.test.mjs

      - name: Check generated adapters
        run: node agentic/sync-agentic-os.mjs --check --platform=none

      # --check valida estructura; --audit valida verdad: archivos congelados
      # que crecieron, monolitos nuevos sin gobierno, skills/agentes huérfanos
      # y rutas o make targets citados que ya no existen.
      - name: Audit governance truth
        run: node agentic/sync-agentic-os.mjs --audit --platform=none

      - name: Check exact R lock and immutable CI
        run: node scripts/check-r-lock.mjs

      - name: Check documentation governance
        run: node scripts/check-docs-governance.mjs

      - name: Check release preview contract
        run: node scripts/release-contract.mjs preview

  # Frontend y backend corren en paralelo: el typecheck roto avisa en ~3-4 min
  # en vez de esperar los ~15 min del suite R (historial: dos releases muertos
  # por TS2307 que recién se supo a los 20 min).
  frontend:
    name: Frontend (typecheck, tests, build, audits)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install frontend dependencies
        run: pnpm -C frontend install --frozen-lockfile

      - name: Install desktop dependencies
        run: pnpm -C desktop install --frozen-lockfile

      - name: Desktop lifecycle tests
        run: pnpm -C desktop test

      # Los contratos de scripts se reparten por la infraestructura que exigen,
      # no por tema: aquí corren los que sólo necesitan Node y el node_modules
      # del frontend (css-cascade-audit resuelve postcss desde ahí). Se excluye
      # por nombre en vez de listar los incluidos, para que un test nuevo entre
      # a este job por defecto en lugar de quedar sin correr en ninguno.
      - name: Repository script contract tests
        run: |
          node --test $(ls scripts/tests/*.test.mjs | grep -vE 'check-r-lock|ui-quick-check-|visual-qa-readiness')

      - name: Check product and system vaults
        run: node scripts/vaults-check.mjs --check

      - name: Check technical-debt baseline
        run: node scripts/debt-audit.mjs --check

      - name: Frontend typecheck
        # El árbol ya no cabe en el tope por defecto de Node (~2 GB): el corte
        # 0.9.6 murió con «JavaScript heap out of memory» a los 2,04 GB. Con
        # 6 GB pasa y cabe en el runner estándar.
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: pnpm -C frontend exec tsc --noEmit --pretty false

      - name: Frontend tests
        run: pnpm -C frontend test

      - name: Frontend production build
        run: pnpm -C frontend exec vite build --outDir /tmp/prosecnur-vite-build --emptyOutDir

      - name: Frontend audit
        run: pnpm -C frontend audit --audit-level=high

      - name: Desktop audit
        run: pnpm -C desktop audit --audit-level=high

  # El backend R va en tres jobs. Antes era uno solo de ~90 min: 40 de ellos
  # recompilando la librería R en cada run, porque `actions/cache` sólo guarda
  # en su post-step si el job termina en verde, y con la suite en rojo la
  # caché no se escribía nunca. Ahora la librería se restaura y se GUARDA en
  # `backend-r-deps` en cuanto queda instalada, pase lo que pase después; el
  # check y los tests la consumen en paralelo, y los tests se reparten en
  # cuatro shards.
  backend-r-deps:
    name: Backend R (lock + librería exacta)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # El contexto `runner` no existe a nivel de job: declarar aquí
      # `env: R_LIBS_USER: ${{ runner.temp }}/…` invalida el workflow entero y
      # GitHub lo rechaza sin crear un solo job. Se exporta desde un step, que
      # es donde $RUNNER_TEMP sí está resuelto, y queda visible para el resto.
      - name: Configure R library path
        run: echo "R_LIBS_USER=${RUNNER_TEMP}/prosecnur-r-library" >> "$GITHUB_ENV"

      - name: Setup R
        uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          r-version: ${{ env.R_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Vive aquí y no en `frontend` porque ejecuta los descargadores de
      # binarios R con Rscript: sin R en el PATH el proceso ni arranca y el
      # assert sólo puede reportar `null null`. Va antes del grueso del job
      # para que un lock roto avise en segundos, no a los 27 minutos.
      - name: R lock and offline installer contract tests
        run: node --test scripts/tests/check-r-lock.test.mjs

      - name: Install R system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcurl4-openssl-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libfribidi-dev \
            libgdal-dev \
            libgeos-dev \
            libharfbuzz-dev \
            libjpeg-dev \
            libpoppler-cpp-dev \
            libpng-dev \
            libproj-dev \
            libqpdf-dev \
            librsvg2-dev \
            libsodium-dev \
            libssl-dev \
            libtiff-dev \
            libudunits2-dev \
            libuv1-dev \
            libxml2-dev \
            libxt6 \
            poppler-utils \
            qpdf

      - name: Restore exact R library
        id: r-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r-library-${{ runner.os }}-${{ env.R_VERSION }}-${{ hashFiles('api/renv.lock') }}

      - name: Restore and verify exact R dependencies
        run: Rscript launcher/install-r-deps.R

      # Se guarda aquí, no en un post-step: así una suite roja no condena al
      # run siguiente a recompilar la librería entera.
      - name: Save exact R library
        if: steps.r-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r-library-${{ runner.os }}-${{ env.R_VERSION }}-${{ hashFiles('api/renv.lock') }}

  backend-r:
    name: Backend R (load_all + R CMD check)
    needs: backend-r-deps
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # El contexto `runner` no existe a nivel de job: declarar aquí
      # `env: R_LIBS_USER: ${{ runner.temp }}/…` invalida el workflow entero y
      # GitHub lo rechaza sin crear un solo job. Se exporta desde un step, que
      # es donde $RUNNER_TEMP sí está resuelto, y queda visible para el resto.
      - name: Configure R library path
        run: echo "R_LIBS_USER=${RUNNER_TEMP}/prosecnur-r-library" >> "$GITHUB_ENV"

      - name: Setup R
        uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          r-version: ${{ env.R_VERSION }}

      - name: Install R system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcurl4-openssl-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libfribidi-dev \
            libgdal-dev \
            libgeos-dev \
            libharfbuzz-dev \
            libjpeg-dev \
            libpoppler-cpp-dev \
            libpng-dev \
            libproj-dev \
            libqpdf-dev \
            librsvg2-dev \
            libsodium-dev \
            libssl-dev \
            libtiff-dev \
            libudunits2-dev \
            libuv1-dev \
            libxml2-dev \
            libxt6 \
            poppler-utils \
            qpdf

      - name: Restore exact R library
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r-library-${{ runner.os }}-${{ env.R_VERSION }}-${{ hashFiles('api/renv.lock') }}
          fail-on-cache-miss: true

      - name: R load_all
        run: Rscript -e "dir.create(Sys.getenv('R_LIBS_USER'), recursive = TRUE, showWarnings = FALSE); .libPaths(c(Sys.getenv('R_LIBS_USER'), .libPaths())); pkgload::load_all('api', quiet = TRUE)"

      - name: R CMD build
        run: |
          cd "${RUNNER_TEMP}"
          R CMD build --no-build-vignettes "${GITHUB_WORKSPACE}/api"

      - name: R CMD check
        run: |
          package_version="$(awk -F': *' '/^Version:/ {print $2; exit}' api/DESCRIPTION)"
          package_tarball="${RUNNER_TEMP}/prosecnurapp_${package_version}.tar.gz"
          test -s "$package_tarball"
          mkdir -p "${RUNNER_TEMP}/r-check"
          R CMD check --no-manual --no-build-vignettes --output="${RUNNER_TEMP}/r-check" "$package_tarball"

  backend-r-tests:
    name: Backend R tests (shard ${{ matrix.shard }}/4)
    needs: backend-r-deps
    runs-on: ubuntu-24.04
    strategy:
      # Un shard rojo no cancela a los otros: el run tiene que mostrar TODOS
      # los rojos de una vez, no el primero.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # El contexto `runner` no existe a nivel de job: declarar aquí
      # `env: R_LIBS_USER: ${{ runner.temp }}/…` invalida el workflow entero y
      # GitHub lo rechaza sin crear un solo job. Se exporta desde un step, que
      # es donde $RUNNER_TEMP sí está resuelto, y queda visible para el resto.
      - name: Configure R library path
        run: echo "R_LIBS_USER=${RUNNER_TEMP}/prosecnur-r-library" >> "$GITHUB_ENV"

      - name: Setup R
        uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          r-version: ${{ env.R_VERSION }}

      - name: Install R system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcurl4-openssl-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libfribidi-dev \
            libgdal-dev \
            libgeos-dev \
            libharfbuzz-dev \
            libjpeg-dev \
            libpoppler-cpp-dev \
            libpng-dev \
            libproj-dev \
            libqpdf-dev \
            librsvg2-dev \
            libsodium-dev \
            libssl-dev \
            libtiff-dev \
            libudunits2-dev \
            libuv1-dev \
            libxml2-dev \
            libxt6 \
            poppler-utils \
            qpdf

      - name: Restore exact R library
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r-library-${{ runner.os }}-${{ env.R_VERSION }}-${{ hashFiles('api/renv.lock') }}
          fail-on-cache-miss: true

      # Los workers callr de jobs deserializan closures contra el paquete
      # INSTALADO (trampa conocida: jobs.R re-resuelve por nombre en el
      # namespace instalado). Sin este paso, los tests de contrato HTTP que
      # disparan jobs reales se skipean en CI.
      - name: R CMD INSTALL (runtime de jobs)
        run: |
          R_LIB="$(Rscript -e 'cat(Sys.getenv("R_LIBS_USER"))')"
          mkdir -p "$R_LIB"
          R CMD INSTALL --no-docs --no-multiarch --library="$R_LIB" api

      # Cada shard corre los archivos test-*.R cuyo índice (orden alfabético)
      # cae en su resto módulo 4. TESTTHAT_MAX_FAILS=Inf: testthat se detenía
      # a los 10 fallos y escondía el resto.
      - name: R tests
        env:
          SHARD: ${{ matrix.shard }}
          TESTTHAT_MAX_FAILS: Inf
        run: |
          Rscript -e "dir.create(Sys.getenv('R_LIBS_USER'), recursive = TRUE, showWarnings = FALSE); .libPaths(c(Sys.getenv('R_LIBS_USER'), .libPaths())); pkgload::load_all('api', quiet = TRUE); f <- sort(list.files('api/tests/testthat', pattern = '^test-.*[.]R$')); k <- as.integer(Sys.getenv('SHARD')); f <- f[(seq_along(f) - 1L) %% 4L == (k - 1L)]; cat(sprintf('shard %d: %d archivos\n', k, length(f))); testthat::test_dir('api/tests/testthat', filter = paste0('^(', paste(gsub('^test-|[.]R$', '', f), collapse = '|'), ')$'), reporter = 'summary')"

  # Los contratos del inspector visual arrancan Chromium de verdad
  # (ui-quick-check.mjs hace chromium.launch() con el @playwright/test del
  # frontend). Corriendo en el job `frontend`, que no instala navegadores, el
  # runner moría sin escribir su report.json y el síntoma era un ENOENT que no
  # nombraba la causa. Job propio: es el único que paga la descarga del
  # navegador, y no bloquea al typecheck ni al suite R.
  ui-contracts:
    name: UI contracts (quick-check, visual QA)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install frontend dependencies
        run: pnpm -C frontend install --frozen-lockfile

      # --with-deps trae las librerías de sistema que Chromium necesita en
      # ubuntu headless; sin ellas el navegador instala pero no levanta.
      - name: Install Chromium for Playwright
        run: pnpm -C frontend exec playwright install --with-deps chromium

      # El prefijo `ui-quick-check-` entra entero, no test por test: todos los
      # contratos de esa familia arrancan Chromium, y nombrarlos uno a uno hacía
      # que cada archivo nuevo naciera en el job equivocado hasta que alguien lo
      # notara. El de exclusión en `frontend` usa el mismo prefijo, así que las
      # dos listas no pueden separarse.
      - name: UI quick-check and visual QA contract tests
        run: |
          node --test \
            scripts/tests/ui-quick-check-*.test.mjs \
            scripts/tests/visual-qa-readiness.test.mjs
