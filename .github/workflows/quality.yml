name: Quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:
  # Corrida manual sobre cualquier branch (p. ej. validar goldens en ubuntu
  # antes de tocar main): gh workflow run quality.yml --ref <branch>
  workflow_dispatch:

permissions:
  contents: read

# Pushes en ráfaga a main cancelan el run anterior del mismo ref: solo importa
# el estado del último commit. Los tags (via workflow_call desde Release) usan
# un ref propio, así que nunca se cancelan entre sí ni cancelan a main.
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  R_VERSION: '4.5.1'
  NODE_VERSION: '20'
  PNPM_VERSION: '10'

jobs:
  agentic-os:
    name: Agentic OS (sync, contracts, smokes)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Test synchronizer and orchestration policy
        run: node --test agentic/tests/*.test.mjs

      - name: Check generated adapters
        run: node agentic/sync-agentic-os.mjs --check --platform=none

  # Frontend y backend corren en paralelo: el typecheck roto avisa en ~3-4 min
  # en vez de esperar los ~15 min del suite R (historial: dos releases muertos
  # por TS2307 que recién se supo a los 20 min).
  frontend:
    name: Frontend (typecheck, tests, build, audits)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install frontend dependencies
        run: pnpm -C frontend install --frozen-lockfile

      - name: Install desktop dependencies
        run: pnpm -C desktop install --frozen-lockfile

      - name: Frontend typecheck
        run: pnpm -C frontend exec tsc --noEmit --pretty false

      - name: Frontend tests
        run: pnpm -C frontend test

      - name: Frontend production build
        run: pnpm -C frontend exec vite build --outDir /tmp/prosecnur-vite-build --emptyOutDir

      # npm retiró el endpoint clásico de `npm audit` (responde 410 →
      # ERR_PNPM_AUDIT_BAD_RESPONSE). Toleramos SOLO ese caso (endpoint caído)
      # para no tumbar el CI; una vulnerabilidad real de nivel high sigue
      # fallando. Revisar cuando pnpm use el bulk advisory endpoint.
      - name: Frontend audit
        run: |
          out=$(pnpm -C frontend audit --audit-level=high 2>&1); code=$?
          echo "$out"
          if [ "$code" != "0" ]; then
            if echo "$out" | grep -q "ERR_PNPM_AUDIT_BAD_RESPONSE"; then
              echo "::warning::pnpm audit endpoint retirado (npm 410); audit omitido."
            else
              exit "$code"
            fi
          fi

      - name: Desktop audit
        run: |
          out=$(pnpm -C desktop audit --audit-level=high 2>&1); code=$?
          echo "$out"
          if [ "$code" != "0" ]; then
            if echo "$out" | grep -q "ERR_PNPM_AUDIT_BAD_RESPONSE"; then
              echo "::warning::pnpm audit endpoint retirado (npm 410); audit omitido."
            else
              exit "$code"
            fi
          fi

  backend-r:
    name: Backend R (load_all + testthat)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ env.R_VERSION }}
          use-public-rspm: true

      - name: Install R system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcurl4-openssl-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libfribidi-dev \
            libgdal-dev \
            libgeos-dev \
            libharfbuzz-dev \
            libjpeg-dev \
            libpng-dev \
            libproj-dev \
            libqpdf-dev \
            librsvg2-dev \
            libssl-dev \
            libtiff-dev \
            libudunits2-dev \
            libxml2-dev \
            libxt6 \
            qpdf

      - name: Install R package dependencies
        run: |
          Rscript -e "dir.create(Sys.getenv('R_LIBS_USER'), recursive = TRUE, showWarnings = FALSE); .libPaths(c(Sys.getenv('R_LIBS_USER'), .libPaths())); options(repos = c(CRAN = Sys.getenv('RSPM', 'https://packagemanager.posit.co/cran/__linux__/noble/latest'))); desc <- read.dcf('api/DESCRIPTION')[1, ]; fields <- intersect(c('Depends', 'Imports', 'Suggests'), names(desc)); pkgs <- trimws(unlist(strsplit(paste(stats::na.omit(desc[fields]), collapse = ','), ','), use.names = FALSE)); pkgs <- sub('[[:space:]]*[(].*$', '', pkgs); pkgs <- unique(setdiff(pkgs[nzchar(pkgs)], 'R')); installed <- rownames(installed.packages(lib.loc = .libPaths())); missing <- setdiff(pkgs, installed); if (length(missing)) install.packages(missing, lib = .libPaths()[1]); installed <- rownames(installed.packages(lib.loc = .libPaths())); missing_after <- setdiff(pkgs, installed); if (length(missing_after)) stop('Missing R packages after install: ', paste(missing_after, collapse = ', '))"

      - name: R load_all
        run: Rscript -e "dir.create(Sys.getenv('R_LIBS_USER'), recursive = TRUE, showWarnings = FALSE); .libPaths(c(Sys.getenv('R_LIBS_USER'), .libPaths())); pkgload::load_all('api', quiet = TRUE)"

      - name: R tests
        run: Rscript -e "dir.create(Sys.getenv('R_LIBS_USER'), recursive = TRUE, showWarnings = FALSE); .libPaths(c(Sys.getenv('R_LIBS_USER'), .libPaths())); pkgload::load_all('api', quiet = TRUE); testthat::test_dir('api/tests/testthat', reporter = 'summary')"
