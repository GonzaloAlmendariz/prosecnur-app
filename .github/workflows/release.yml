# =============================================================================
# Prosecnur — canales de distribución fail-closed
#
# workflow_dispatch:
#   internal-preview; construye y conserva artefactos internos, pero no publica
#   GitHub Releases ni transporta manifests/blockmaps del auto-updater.
#
# push de tag vX.Y.Z:
#   stable; valida identidad/monotonicidad, ejecuta Quality y exige que Windows
#   y macOS, incluidos sus gates de firma, terminen antes de publicar.
# =============================================================================
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  R_VERSION: '4.5.1'
  NODE_VERSION: '20'
  PNPM_VERSION: '10'

jobs:
  contract:
    name: Validate release channel contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with release history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Validate internal-preview identity
        if: github.event_name == 'workflow_dispatch'
        run: node scripts/release-contract.mjs preview

      - name: Validate stable identity and tag
        if: github.event_name == 'push'
        run: node scripts/release-contract.mjs stable --tag "${{ github.ref_name }}"

  quality:
    name: Quality gate
    needs: contract
    uses: ./.github/workflows/quality.yml

  # El bundle Windows se arma en Linux: no contiene módulos nativos propios y
  # NSIS resulta más estable aquí. Stable agrega una verificación Authenticode
  # separada; el workflow no crea ni presupone secretos de firma.
  build-windows:
    name: Build Windows
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ env.R_VERSION }}
          use-public-rspm: true

      - name: Install Windows build and verification dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            imagemagick \
            librsvg2-bin \
            nsis \
            osslsigncode \
            rsync \
            unzip

      - name: Cache R Windows binaries
        uses: actions/cache@v4
        with:
          path: dist.nosync/windows-cache
          key: r-win-cache-${{ env.R_VERSION }}-${{ hashFiles('api/DESCRIPTION') }}
          restore-keys: |
            r-win-cache-${{ env.R_VERSION }}-

      - name: Install pnpm dependencies
        run: |
          pnpm -C frontend install --frozen-lockfile
          pnpm -C desktop install --frozen-lockfile

      - name: Build Windows installer and portable bundle
        run: bash packaging/windows/build-self-contained.sh

      - name: Verify Windows payload
        shell: bash
        run: |
          set -euo pipefail
          installer="dist.nosync/Prosecnur-Setup.exe"
          bundle="dist.nosync/Prosecnur-Windows-self-contained.zip"
          listing="${RUNNER_TEMP}/prosecnur-windows-zip.txt"

          test -s "$installer"
          test -s "$bundle"
          unzip -tq "$bundle"
          unzip -Z1 "$bundle" > "$listing"

          for required in \
            "Prosecnur-Windows/Prosecnur.bat" \
            "Prosecnur-Windows/Internals/api/DESCRIPTION" \
            "Prosecnur-Windows/Internals/desktop/package.json" \
            "Prosecnur-Windows/runtime/electron/electron.exe"
          do
            if ! grep -Fx "$required" "$listing" > /dev/null; then
              echo "::error::El ZIP Windows no contiene $required"
              exit 1
            fi
          done

          source_version="$(awk -F': *' '/^Version:/ {print $2; exit}' api/DESCRIPTION)"
          bundled_version="$(
            unzip -p "$bundle" Prosecnur-Windows/Internals/api/DESCRIPTION |
              awk -F': *' '/^Version:/ {print $2; exit}'
          )"
          if [ -z "$source_version" ] || [ "$bundled_version" != "$source_version" ]; then
            echo "::error::El ZIP Windows no conserva la versión canónica"
            exit 1
          fi

      - name: Verify Windows stable signature
        if: github.event_name == 'push'
        run: osslsigncode verify -in dist.nosync/Prosecnur-Setup.exe

      - name: Remove updater metadata from Windows internal preview
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          rm -f dist.nosync/latest.yml
          test ! -e dist.nosync/latest.yml

      - name: Upload Windows internal preview
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: internal-preview-windows
          retention-days: 7
          if-no-files-found: error
          path: |
            dist.nosync/Prosecnur-Setup.exe
            dist.nosync/Prosecnur-Windows-self-contained.zip

      - name: Upload Windows stable payload
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: stable-windows
          retention-days: 7
          if-no-files-found: error
          path: |
            dist.nosync/Prosecnur-Setup.exe
            dist.nosync/Prosecnur-Windows-self-contained.zip
            dist.nosync/latest.yml

  build-mac:
    name: Build macOS
    needs: quality
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ env.R_VERSION }}
          use-public-rspm: true

      - name: Install macOS build dependencies
        run: brew install librsvg imagemagick

      - name: Cache R macOS binaries
        uses: actions/cache@v4
        with:
          path: dist.nosync/mac-cache
          key: r-mac-cache-${{ env.R_VERSION }}-${{ hashFiles('api/DESCRIPTION') }}
          restore-keys: |
            r-mac-cache-${{ env.R_VERSION }}-

      - name: Install pnpm dependencies
        run: |
          pnpm -C frontend install --frozen-lockfile
          pnpm -C desktop install --frozen-lockfile

      - name: Build macOS DMGs
        env:
          PROSECNUR_DMG_ARCHS: 'arm64 x64'
        run: bash packaging/macos/build-dmg.sh

      - name: Verify macOS payload
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmgs=(dist.nosync/mac-builder-output/*.dmg)

          if [ "${#dmgs[@]}" -ne 2 ]; then
            echo "::error::Se esperaban exactamente dos DMG (arm64 y x64)"
            exit 1
          fi
          if [ ! -s dist.nosync/mac-builder-output/*-arm64.dmg ]; then
            echo "::error::Falta el DMG arm64"
            exit 1
          fi
          if [ ! -s dist.nosync/mac-builder-output/*-x64.dmg ]; then
            echo "::error::Falta el DMG x64"
            exit 1
          fi

          for dmg in "${dmgs[@]}"; do
            hdiutil verify "$dmg"
          done

      - name: Verify macOS stable updater payloads and signatures
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          output="dist.nosync/mac-builder-output"
          manifest="$output/latest-mac.yml"
          zips=("$output"/*.zip)

          if [ "${#zips[@]}" -ne 2 ]; then
            echo "::error::Stable exige exactamente dos ZIP macOS (arm64 y x64)"
            exit 1
          fi
          if [ ! -s "$output"/*-arm64.zip ] || [ ! -s "$output"/*-x64.zip ]; then
            echo "::error::Falta un ZIP macOS para arm64 o x64"
            exit 1
          fi
          test -s "$manifest"

          for zip in "${zips[@]}"; do
            basename="$(basename "$zip")"
            extract_dir="${RUNNER_TEMP}/${basename%.zip}"

            unzip -tq "$zip"
            if ! grep -F "$basename" "$manifest" > /dev/null; then
              echo "::error::$manifest no referencia $basename"
              exit 1
            fi
            if [ ! -s "$zip.blockmap" ]; then
              echo "::error::Falta el blockmap de $basename"
              exit 1
            fi

            mkdir -p "$extract_dir"
            ditto -x -k "$zip" "$extract_dir"
            apps=("$extract_dir"/*.app)
            if [ "${#apps[@]}" -ne 1 ]; then
              echo "::error::$basename no contiene exactamente una app"
              exit 1
            fi

            codesign --verify --deep --strict --verbose=2 "${apps[0]}"
            signature="$(codesign -dv --verbose=4 "${apps[0]}" 2>&1)"
            if [[ "$signature" != *"Authority=Developer ID Application:"* ]]; then
              echo "::error::La app dentro de $basename no tiene firma Developer ID Application"
              exit 1
            fi
          done

      - name: Remove updater payloads from macOS internal preview
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          find dist.nosync/mac-builder-output -maxdepth 1 -type f \
            \( -name 'latest*.yml' -o -name '*.blockmap' -o -name '*.zip' \) \
            -delete
          if find dist.nosync/mac-builder-output -maxdepth 1 -type f \
            \( -name 'latest*.yml' -o -name '*.blockmap' -o -name '*.zip' \) \
            -print -quit | grep -q .; then
            echo "::error::El preview conserva payloads del auto-updater"
            exit 1
          fi

      - name: Upload macOS internal preview
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: internal-preview-macos
          retention-days: 7
          if-no-files-found: error
          path: dist.nosync/mac-builder-output/*.dmg

      - name: Upload macOS stable payload
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: stable-macos
          retention-days: 7
          if-no-files-found: error
          path: |
            dist.nosync/mac-builder-output/*.dmg
            dist.nosync/mac-builder-output/*.zip
            dist.nosync/mac-builder-output/latest-mac.yml
            dist.nosync/mac-builder-output/*.blockmap

  publish:
    name: Publish stable GitHub Release
    needs: [contract, quality, build-windows, build-mac]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout release notes
        uses: actions/checkout@v4

      - name: Download Windows stable payload
        uses: actions/download-artifact@v4
        with:
          name: stable-windows
          path: artifacts/windows

      - name: Download macOS stable payload
        uses: actions/download-artifact@v4
        with:
          name: stable-macos
          path: artifacts/mac

      - name: Verify publication payload
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          test -s artifacts/windows/Prosecnur-Setup.exe
          test -s artifacts/windows/Prosecnur-Windows-self-contained.zip
          test -s artifacts/windows/latest.yml
          test -s artifacts/mac/latest-mac.yml

          dmgs=(artifacts/mac/*.dmg)
          zips=(artifacts/mac/*.zip)
          blockmaps=(artifacts/mac/*.blockmap)
          if [ "${#dmgs[@]}" -ne 2 ] ||
             [ "${#zips[@]}" -ne 2 ] ||
             [ "${#blockmaps[@]}" -lt 2 ]; then
            echo "::error::El payload stable de macOS está incompleto"
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Prosecnur ${{ github.ref_name }}
          body_path: .github/RELEASE_NOTES.md
          fail_on_unmatched_files: true
          files: |
            artifacts/windows/Prosecnur-Setup.exe
            artifacts/windows/Prosecnur-Windows-self-contained.zip
            artifacts/windows/latest.yml
            artifacts/mac/*.dmg
            artifacts/mac/*.zip
            artifacts/mac/latest-mac.yml
            artifacts/mac/*.blockmap
