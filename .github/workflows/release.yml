# =============================================================================
# Prosecnur — canales de distribución fail-closed
#
# workflow_dispatch:
#   internal-preview; construye y conserva artefactos internos, pero no publica
#   GitHub Releases ni transporta manifests/blockmaps del auto-updater.
#
# push de tag vX.Y.Z:
#   stable; valida identidad/monotonicidad, ejecuta Quality y exige que Windows
#   y macOS terminen antes de publicar. Sin firma de distribución: el ADR 0056
#   la retiró porque el repositorio no tiene certificados y exigirla dejaba el
#   canal inalcanzable. Windows publica su updater; macOS va por DMG a mano.
# =============================================================================
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  R_VERSION: '4.5.1'
  NODE_VERSION: '20'
  PNPM_VERSION: '10'

jobs:
  contract:
    name: Validate release channel contract
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout with release history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Validate exact R lock and immutable workflow inputs
        run: node scripts/check-r-lock.mjs

      - name: Validate internal-preview identity
        if: github.event_name == 'workflow_dispatch'
        run: node scripts/release-contract.mjs preview

      - name: Validate stable identity and tag
        if: github.event_name == 'push'
        run: node scripts/release-contract.mjs stable --tag "${{ github.ref_name }}"

  # Reusa un Quality ya verde del MISMO commit en vez de repetirlo. El SHA fija
  # el arbol entero, incluida la definicion de quality.yml, asi que un run
  # exitoso sobre ese commit no puede diferir del que correriamos ahora. Este
  # job existia antes de 32aa1ec5 y su retiro llevo el release de ~9 a ~31+ min,
  # porque el flujo normal (pushear main, esperar Quality verde, taggear ese
  # mismo commit) paga el gate dos veces.
  precheck:
    name: ¿Quality ya pasó para este SHA?
    needs: contract
    runs-on: ubuntu-24.04
    outputs:
      skip_gate: ${{ steps.check.outputs.skip_gate }}
    steps:
      - name: Buscar Quality exitoso del mismo commit
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ok=$(gh api "repos/${{ github.repository }}/actions/workflows/quality.yml/runs?head_sha=${{ github.sha }}&status=completed&per_page=20" \
            --jq '[.workflow_runs[] | select(.conclusion=="success")] | length' 2>/dev/null || echo 0)
          if [ "${ok:-0}" -gt 0 ]; then
            echo "skip_gate=true" >> "$GITHUB_OUTPUT"
            echo "[precheck] Quality ya pasó para ${{ github.sha }}; se reusa ese verde."
          else
            echo "skip_gate=false" >> "$GITHUB_OUTPUT"
            echo "[precheck] Sin Quality exitoso previo para este SHA; el gate corre completo."
          fi

  quality:
    name: Quality gate
    needs: precheck
    if: needs.precheck.outputs.skip_gate != 'true'
    uses: ./.github/workflows/quality.yml

  # El bundle Windows se arma en Linux: no contiene módulos nativos propios y
  # NSIS resulta más estable aquí. Stable agrega una verificación Authenticode
  # separada; el workflow no crea ni presupone secretos de firma.
  # El build sigue detras del gate a proposito. Desengancharlo para ganar
  # paralelismo dejaria a `internal-preview` sin gate real: ahi no hay job
  # `publish` que verifique Quality, asi que un Quality rojo produciria y subiria
  # los artefactos de preview, que son justamente los que el ADR 0056 manda
  # adjuntar a mano. Con `precheck` el paralelismo tampoco haria falta: en el
  # flujo normal Quality queda SKIPPED y el build arranca igual de inmediato.
  build-windows:
    name: Build Windows
    needs: [precheck, quality]
    if: >-
      always()
      && needs.precheck.result == 'success'
      && (needs.quality.result == 'success'
          || (needs.precheck.outputs.skip_gate == 'true'
              && needs.quality.result == 'skipped'))
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup R
        uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          r-version: ${{ env.R_VERSION }}

      - name: Install Windows build and verification dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            imagemagick \
            librsvg2-bin \
            nsis \
            rsync \
            unzip

      - name: Cache R Windows binaries
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: dist.nosync/windows-cache
          key: r-win-cache-${{ env.R_VERSION }}-${{ hashFiles('api/renv.lock') }}

      - name: Install pnpm dependencies
        run: |
          pnpm -C frontend install --frozen-lockfile
          pnpm -C desktop install --frozen-lockfile

      - name: Build Windows installer and portable bundle
        run: bash packaging/windows/build-self-contained.sh

      - name: Verify Windows payload
        shell: bash
        run: |
          set -euo pipefail
          installer="dist.nosync/Prosecnur-Setup.exe"
          bundle="dist.nosync/Prosecnur-Windows-self-contained.zip"
          listing="${RUNNER_TEMP}/prosecnur-windows-zip.txt"

          test -s "$installer"
          test -s "$bundle"
          unzip -tq "$bundle"
          unzip -Z1 "$bundle" > "$listing"

          for required in \
            "Prosecnur-Windows/Prosecnur.bat" \
            "Prosecnur-Windows/Internals/api/DESCRIPTION" \
            "Prosecnur-Windows/Internals/desktop/package.json" \
            "Prosecnur-Windows/runtime/electron/electron.exe"
          do
            if ! grep -Fx "$required" "$listing" > /dev/null; then
              echo "::error::El ZIP Windows no contiene $required"
              exit 1
            fi
          done

          source_version="$(awk -F': *' '/^Version:/ {print $2; exit}' api/DESCRIPTION)"
          bundled_version="$(
            unzip -p "$bundle" Prosecnur-Windows/Internals/api/DESCRIPTION |
              awk -F': *' '/^Version:/ {print $2; exit}'
          )"
          if [ -z "$source_version" ] || [ "$bundled_version" != "$source_version" ]; then
            echo "::error::El ZIP Windows no conserva la versión canónica"
            exit 1
          fi

      # Sin firma Authenticode (ADR 0056): el repositorio no tiene certificado
      # de distribucion y exigirlo dejaba `stable` inalcanzable. SmartScreen
      # advertira al instalar, igual que en las diecinueve releases previas a
      # 32aa1ec5. La integridad del ZIP y la version canonica si se verifican
      # arriba, porque no dependen de un certificado.

      - name: Remove updater metadata from Windows internal preview
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          rm -f dist.nosync/latest.yml
          test ! -e dist.nosync/latest.yml

      - name: Upload Windows internal preview
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: internal-preview-windows
          retention-days: 7
          if-no-files-found: error
          path: |
            dist.nosync/Prosecnur-Setup.exe
            dist.nosync/Prosecnur-Windows-self-contained.zip

      - name: Upload Windows stable payload
        if: github.event_name == 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stable-windows
          retention-days: 7
          if-no-files-found: error
          path: |
            dist.nosync/Prosecnur-Setup.exe
            dist.nosync/Prosecnur-Windows-self-contained.zip
            dist.nosync/latest.yml

  build-mac:
    name: Build macOS (arm64 + x64)
    needs: [precheck, quality]
    if: >-
      always()
      && needs.precheck.result == 'success'
      && (needs.quality.result == 'success'
          || (needs.precheck.outputs.skip_gate == 'true'
              && needs.quality.result == 'skipped'))
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup R
        uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          r-version: ${{ env.R_VERSION }}

      - name: Install macOS build dependencies
        run: brew install librsvg imagemagick

      - name: Cache R macOS binaries
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: dist.nosync/mac-cache
          key: r-mac-cache-${{ env.R_VERSION }}-${{ hashFiles('api/renv.lock') }}

      - name: Install pnpm dependencies
        run: |
          pnpm -C frontend install --frozen-lockfile
          pnpm -C desktop install --frozen-lockfile

      - name: Build macOS DMGs
        env:
          PROSECNUR_DMG_ARCHS: 'arm64 x64'
        run: bash packaging/macos/build-dmg.sh

      - name: Verify macOS payload
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmgs=(dist.nosync/mac-builder-output/*.dmg)

          if [ "${#dmgs[@]}" -ne 2 ]; then
            echo "::error::Se esperaban exactamente dos DMG (arm64 y x64)"
            exit 1
          fi
          if [ ! -s dist.nosync/mac-builder-output/*-arm64.dmg ]; then
            echo "::error::Falta el DMG arm64"
            exit 1
          fi
          if [ ! -s dist.nosync/mac-builder-output/*-x64.dmg ]; then
            echo "::error::Falta el DMG x64"
            exit 1
          fi

          for dmg in "${dmgs[@]}"; do
            hdiutil verify "$dmg"
          done

      # Sin firma Developer ID ni payloads de updater en macOS (ADR 0056).
      # `mac.target` emite solo DMG, de modo que exigir dos ZIP, su manifest y
      # sus blockmaps dejaba `stable` inalcanzable por construccion, no por un
      # defecto del build. macOS se distribuye por DMG y se actualiza a mano;
      # Windows conserva su `latest.yml` y su updater. La integridad de los dos
      # DMG la verifica el paso anterior con `hdiutil verify`, que no depende
      # de ningun certificado.

      - name: Remove updater payloads from macOS internal preview
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          find dist.nosync/mac-builder-output -maxdepth 1 -type f \
            \( -name 'latest*.yml' -o -name '*.blockmap' -o -name '*.zip' \) \
            -delete
          if find dist.nosync/mac-builder-output -maxdepth 1 -type f \
            \( -name 'latest*.yml' -o -name '*.blockmap' -o -name '*.zip' \) \
            -print -quit | grep -q .; then
            echo "::error::El preview conserva payloads del auto-updater"
            exit 1
          fi

      - name: Upload macOS internal preview
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: internal-preview-macos
          retention-days: 7
          if-no-files-found: error
          path: dist.nosync/mac-builder-output/*.dmg

      - name: Upload macOS stable payload
        if: github.event_name == 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stable-macos
          retention-days: 7
          if-no-files-found: error
          path: |
            dist.nosync/mac-builder-output/*.dmg

  publish:
    name: Publish stable GitHub Release
    needs: [contract, precheck, quality, build-windows, build-mac]
    # `always()` es obligatorio porque `quality` puede quedar SKIPPED cuando
    # precheck reusa un verde previo, y un `needs` saltado saltaria tambien a
    # este job. La condicion no se relaja por eso: cada dependencia bloqueante se
    # exige 'success' de forma explicita, y a `quality` se le acepta 'skipped'
    # solo si precheck declaro haber encontrado ese verde sobre el mismo SHA.
    #
    # `build-mac` figura en `needs` para esperarlo, pero NO se le exige exito:
    # Windows es el artefacto bloqueante y el DMG de macOS es best-effort, sin
    # code-signing. Un runner de macOS caido no puede dejar sin release a los
    # usuarios de Windows, que son la mayoria.
    if: >-
      always()
      && github.event_name == 'push'
      && needs.contract.result == 'success'
      && needs.precheck.result == 'success'
      && needs['build-windows'].result == 'success'
      && (needs.quality.result == 'success'
          || (needs.precheck.outputs.skip_gate == 'true'
              && needs.quality.result == 'skipped'))
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout release notes
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download Windows stable payload
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: stable-windows
          path: artifacts/windows

      # Solo se descarga si el build de macOS termino bien: si fallo, su
      # artefacto no existe y la descarga romperia el release de Windows. Se
      # expresa condicionando por el resultado del job, no tolerando el error del
      # paso, que enmascararia tambien fallos de red o de permisos.
      - name: Download macOS stable payload (best-effort)
        if: needs['build-mac'].result == 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: stable-macos
          path: artifacts/mac

      - name: Verify publication payload
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          test -s artifacts/windows/Prosecnur-Setup.exe
          test -s artifacts/windows/Prosecnur-Windows-self-contained.zip
          test -s artifacts/windows/latest.yml

          # Windows es bloqueante y sus tres archivos se exigen arriba. macOS es
          # best-effort (ADR 0056): publica DMG, no participa del updater y su
          # ausencia no detiene el release. Se avisa, que no es lo mismo que
          # callarlo, pero no se falla.
          dmgs=(artifacts/mac/*.dmg)
          if [ "${#dmgs[@]}" -eq 2 ]; then
            echo "macOS: dos DMG presentes; se adjuntan al release."
          else
            echo "::warning::Release sin los dos DMG de macOS (${#dmgs[@]} presentes). Se publica solo Windows."
          fi

      # La lista se compone aqui para conservar `fail_on_unmatched_files: true`
      # sin volver obligatorio el DMG: los tres archivos de Windows se listan
      # siempre, y los de macOS solo si existen. Con la bandera en `false` un
      # error de nombre en el lado Windows publicaria un release vacio en
      # silencio, que es precisamente lo que no queremos tolerar.
      - name: Compose release asset list
        id: assets
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          {
            echo "files<<PROSECNUR_EOF"
            echo "artifacts/windows/Prosecnur-Setup.exe"
            echo "artifacts/windows/Prosecnur-Windows-self-contained.zip"
            echo "artifacts/windows/latest.yml"
            for dmg in artifacts/mac/*.dmg; do echo "$dmg"; done
            echo "PROSECNUR_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Prosecnur ${{ github.ref_name }}
          body_path: .github/RELEASE_NOTES.md
          fail_on_unmatched_files: true
          files: ${{ steps.assets.outputs.files }}
