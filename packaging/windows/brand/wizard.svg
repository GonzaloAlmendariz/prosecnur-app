<?xml version="1.0" encoding="UTF-8"?>
<!-- Sidebar del NSIS MUI Welcome page (164x314). Identidad v1.1.
     Fondo navy + isotipo canonico en variante mono blanco con calado
     (branding/logo/prosecnur-mono-blanco.svg): squircle blanco y pastillas
     caladas que dejan respirar el gradiente del fondo. Es la variante
     canonica para fondos oscuros y mantiene las dos tintas de la marca
     (navy + blanco) sin introducir un segundo navy plano que pelee con
     el gradiente del sidebar.
     Isotipo 64x64 escalado x1.4375 → 92x92 (coordenadas absolutas:
     x = 36 + 1.4375*x0, y = 42 + 1.4375*y0), centrado en x = 82 = 164/2. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 164 314" width="164" height="314">
  <defs>
    <linearGradient id="nsis-wizard-fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#012558"/>
      <stop offset="100%" stop-color="#001a40"/>
    </linearGradient>
    <mask id="nsis-wizard-calado" maskUnits="userSpaceOnUse" x="36" y="42" width="92" height="92">
      <rect x="36" y="42" width="92" height="92" rx="22.1375" fill="#ffffff"/>
      <rect x="53.25" y="85.125" width="10.0625" height="25.875" rx="5.03125" fill="#000000"/>
      <rect x="69.0625" y="73.625" width="10.0625" height="37.375" rx="5.03125" fill="#000000"/>
      <rect x="84.875" y="82.25" width="10.0625" height="28.75" rx="5.03125" fill="#000000"/>
      <rect x="100.6875" y="65" width="10.0625" height="46" rx="5.03125" fill="#000000"/>
    </mask>
  </defs>
  <!-- Fondo del sidebar -->
  <rect width="164" height="314" fill="url(#nsis-wizard-fondo)"/>

  <!-- Isotipo mono blanco calado, 92x92, centrado horizontal arriba -->
  <rect x="36" y="42" width="92" height="92" rx="22.1375" fill="#ffffff" mask="url(#nsis-wizard-calado)"/>

  <!-- Wordmark "Prosecnur" debajo del logo. Mismo estilo que .home-hero-wordmark
       (font-weight 800, letter-spacing apretado), color blanco para contraste
       sobre el fondo navy. -->
  <text x="82" y="180"
        text-anchor="middle"
        font-family="Segoe UI, system-ui, sans-serif"
        font-weight="800"
        font-size="22"
        letter-spacing="-0.6"
        fill="#ffffff">Prosecnur</text>

  <!-- Tagline pequenia, opcional, en gris claro -->
  <text x="82" y="200"
        text-anchor="middle"
        font-family="Segoe UI, system-ui, sans-serif"
        font-weight="400"
        font-size="9"
        letter-spacing="0.6"
        fill="#94a3b8">SUITE ANALITICA</text>

  <!-- Pulso PUCP attribution chiquita al pie -->
  <text x="82" y="298"
        text-anchor="middle"
        font-family="Segoe UI, system-ui, sans-serif"
        font-weight="500"
        font-size="9"
        letter-spacing="0.5"
        fill="#cbd5e1"
        fill-opacity="0.75">PULSO PUCP</text>
</svg>
