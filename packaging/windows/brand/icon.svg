<?xml version="1.0" encoding="UTF-8"?>
<!-- Isotipo canonico de Prosecnur (identidad v1.1, «Ecualizador del pulso»).
     Fuente de verdad: branding/logo/prosecnur-isotipo-gradiente.svg.
     Squircle navy rx 24% (15.4/64) con gradiente vertical #013371 (arriba) →
     #002457 (abajo) + 4 pastillas blancas solidas: width 7, rx 3.5,
     x = 12/23/34/45, alturas 18/26/20/32, baseline comun y = 48.
     De este SVG se derivan prosecnur.ico (build-self-contained.sh) e
     icon.icns (packaging/macos/build-dmg.sh). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="nsis-icon-fondo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#013371"/>
      <stop offset="1" stop-color="#002457"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="64" height="64" rx="15.4" fill="url(#nsis-icon-fondo)"/>
  <rect x="12" y="30" width="7" height="18" rx="3.5" fill="#ffffff"/>
  <rect x="23" y="22" width="7" height="26" rx="3.5" fill="#ffffff"/>
  <rect x="34" y="28" width="7" height="20" rx="3.5" fill="#ffffff"/>
  <rect x="45" y="16" width="7" height="32" rx="3.5" fill="#ffffff"/>
</svg>
