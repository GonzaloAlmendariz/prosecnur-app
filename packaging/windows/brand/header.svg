<?xml version="1.0" encoding="UTF-8"?>
<!-- Header del NSIS MUI (150x57). Identidad v1.1.
     Lockup horizontal canonico (branding/logo/prosecnur-lockup-horizontal.svg):
     squircle navy plano #002457 — el lockup sobre fondo claro no usa gradiente —
     + wordmark «Prosecnur» en Segoe UI 800 con tracking negativo.
     Isotipo canonico 64x64 escalado a 40x40 (scale 0.625); centrado vertical
     exacto: (57-40)/2 = 8.5. Baseline del texto 34 ≈ centro 28.5 + cap/2.
     Fondo blanco para fundirse con el header de las paginas internas. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 57" width="150" height="57">
  <rect width="150" height="57" fill="#ffffff"/>

  <!-- Isotipo canonico a la izquierda, 40x40 -->
  <g transform="translate(8 8.5) scale(0.625)">
    <rect x="0" y="0" width="64" height="64" rx="15.4" fill="#002457"/>
    <rect x="12" y="30" width="7" height="18" rx="3.5" fill="#ffffff"/>
    <rect x="23" y="22" width="7" height="26" rx="3.5" fill="#ffffff"/>
    <rect x="34" y="28" width="7" height="20" rx="3.5" fill="#ffffff"/>
    <rect x="45" y="16" width="7" height="32" rx="3.5" fill="#ffffff"/>
  </g>

  <!-- Wordmark "Prosecnur" a la derecha del isotipo -->
  <text x="57" y="34"
        font-family="Segoe UI, system-ui, sans-serif"
        font-weight="800"
        font-size="16"
        letter-spacing="-0.4"
        fill="#002457">Prosecnur</text>
</svg>
